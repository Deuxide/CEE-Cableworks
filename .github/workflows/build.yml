name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "Checkout Create: Electro Energetics"
        uses: actions/checkout@v4
        with:
          repository: george8188625/Create-Electro-Energetics
          ref: 1.21.1
          path: cee

      - name: "Publish Create: Electro Energetics to Maven local"
        working-directory: cee
        run: ./gradlew publishMavenJavaPublicationToMavenLocal

      - name: "Show where CEE was published"
        run: |
          echo "HOME=$HOME"
          find "$HOME/.m2/repository/com/george_vi" -type f 2>/dev/null || echo "nothing under ~/.m2 for com.george_vi"
          find "$HOME/.m2" -name "*.pom" -newer cee/build.gradle 2>/dev/null | head -20
          ls -la cee/build/libs 2>/dev/null || echo "no cee/build/libs"

      - name: Build with Gradle
        run: ./gradlew build