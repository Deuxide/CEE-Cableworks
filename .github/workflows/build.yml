name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "Checkout Create: Electro Energetics"
        uses: actions/checkout@v4
        with:
          repository: george8188625/Create-Electro-Energetics
          ref: 1.21.1
          # Gradle takes the artifact ID from the folder name, so this must be "electroenergetics"
          path: electroenergetics

      - name: "Publish Create: Electro Energetics to Maven local"
        working-directory: electroenergetics
        run: ./gradlew publishMavenJavaPublicationToMavenLocal

      - name: Build with Gradle
        run: ./gradlew build